name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on PR branches only. On main every push is a merge
# that the deploy workflow (deploy.yml, workflow_run on CI) keys off, so main runs are
# never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Job `name:`s are the required status checks in branch protection — renaming
# one strands the required check in "Expected — Waiting for status".
jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=8.21.2
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scans the working tree (--no-git) so every push is validated against
      # its post-merge state.
      - name: Scan working tree
        run: gitleaks detect --source . --no-git --redact --verbose --no-banner

  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # WeasyPrint (app/services/pdf/) needs Pango/HarfBuzz and a font with
      # ½ ¼ ¾ from the OS, like docker/backend/Dockerfile.prod.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ruff
        run: ruff check app tests alembic

      - name: Ruff format
        run: ruff format --check app tests alembic

      # Tests use testcontainers, which spawns a sibling postgres:17-alpine
      # container via the runner's docker socket. DATABASE_URL is deliberately
      # bogus so anything that bypasses the test fixtures fails loudly.
      - name: Pytest
        env:
          DATABASE_URL: postgresql://test:test@localhost:1/none
          ENVIRONMENT: test
        run: pytest --cov=app --cov-report=term -q

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
