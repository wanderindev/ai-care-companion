name: Deploy

# Builds the production images and pushes them to GHCR (the DO registry is at
# its repository cap). pic-watchtower on the droplet polls `latest` and
# recreates n16chat-backend / n16chat-worker / n16chat-frontend, so this
# workflow never touches the server.
#
# Triggered via `workflow_run` so it runs only after CI on main, and
# `workflow_run` fires on failed CI runs too, so every job carries an explicit
# `conclusion == 'success'` guard: that guard is what enforces "never deploy a
# red main" (same pattern as panama-in-context).
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Queue deploys instead of cancelling them: a cancelled run could leave
# `latest` updated for one image and stale for the other.
concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/wanderindev
  # Tag and check out the exact commit CI validated (falls back to the
  # dispatch ref's SHA for manual runs).
  IMAGE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  changes:
    name: Changes
    # `paths:` filters are unavailable on workflow_run, so path filtering is
    # done here from the commit diff.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}
          fetch-depth: 2

      # Known limitation: a multi-commit *direct* push to main diffs only the
      # tip commit. main is PR-merge driven, so the merge commit diffs the whole
      # PR against the previous main tip; workflow_dispatch (which builds both)
      # covers the rare miss.
      - name: Detect changed services
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "manual dispatch: building everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            echo "no parent commit: building everything"
            echo "backend=true" >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only HEAD^ HEAD)
          echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(backend/|docker/backend/)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED" | grep -qE '^(frontend/|docker/frontend/)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

  build-backend:
    name: Build & push backend
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
      && needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # provenance: false keeps one package version per push (an attestation
      # manifest would add an untagged version each time and skew pruning).
      - name: Build and push n16chat-backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend/Dockerfile.prod
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/n16chat-backend:latest
            ${{ env.REGISTRY }}/n16chat-backend:${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=n16chat-backend
          cache-to: type=gha,mode=max,scope=n16chat-backend

  build-frontend:
    name: Build & push frontend
    needs: changes
    if: |
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
      && needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.IMAGE_SHA }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push n16chat-frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/frontend/Dockerfile.prod
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/n16chat-frontend:latest
            ${{ env.REGISTRY }}/n16chat-frontend:${{ env.IMAGE_SHA }}
          cache-from: type=gha,scope=n16chat-frontend
          cache-to: type=gha,mode=max,scope=n16chat-frontend

  prune:
    name: Prune old image versions
    needs: [build-backend, build-frontend]
    # `!cancelled()` so this still runs when one build was skipped by the path
    # filter (a skipped `needs` otherwise skips this job).
    if: ${{ !cancelled() && (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package: [n16chat-backend, n16chat-frontend]
    steps:
      # Keeps the newest 5 versions of each package (the one `latest` points
      # to plus 4 SHA-tagged rollback targets) and deletes the rest, so GHCR
      # storage stays small. Only n16chat-* packages are ever touched.
      - uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ matrix.package }}
          package-type: container
          min-versions-to-keep: 5
          ignore-versions: '^latest$'
