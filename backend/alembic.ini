# Alembic configuration

[alembic]
script_location = alembic

# Revisions are numbered by hand: alembic revision -m "..." --rev-id 0002
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
timezone = UTC
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

# Overridden by the DATABASE_URL env var (see alembic/env.py)
sqlalchemy.url = driver://user:pass@localhost/dbname


[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
