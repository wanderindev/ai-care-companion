# n16chat-frontend: serves the built SPA on :80 behind the edge nginx
# (pic-frontend), which terminates TLS and sends /api/ to n16chat-backend.

# Access log without query strings or referers: a magic-link token in a URL
# (e.g. /entrar?token=...) must never reach `docker logs`, and asset requests
# would otherwise carry it in their Referer.
map $request_uri $n16chat_path {
    "~^(?<path>[^?]*)" $path;
    default            "-";
}
log_format n16chat_noquery '$remote_addr - [$time_local] "$request_method $n16chat_path '
                           '$server_protocol" $status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log n16chat_noquery;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;
    gzip_min_length 1024;

    # Container healthcheck (docker-compose.prod.yml / Dockerfile.prod).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The edge routes /api/ to the backend; never answer it with the SPA.
    location /api/ {
        return 404;
    }

    # Vite content-hashed bundles: cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Service worker, its registration script, the workbox runtime and the
    # manifest must be revalidated on every load or a deploy never reaches
    # installed PWAs.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # The app shell: always revalidated (also reached via the SPA fallback).
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback: client-side routes (/bitacora, /labs, ...) get index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
